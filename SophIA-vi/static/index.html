<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SophIA | UNOPAR</title>
<meta name="description" content="Assistente acadêmico para estudantes">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="chat-app" id="chatApp">

  <button type="button" tabindex="-1" aria-label="Fechar menu" class="sidebar-backdrop" id="sidebarBackdrop" hidden></button>

  <aside id="chat-sidebar" aria-label="Menu de conversas" class="sidebar">
    <header class="sidebar-header">
      <div class="brand">
        <div class="brand-logo-frame">
          <img src="/unopar-logo.png" alt="Unopar" class="brand-logo">
        </div>
      </div>
      <button aria-label="Fechar menu" class="icon-button mobile-only" id="closeSidebarBtn">
        <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M6 18 18 6"/></svg>
      </button>
    </header>

    <div class="sidebar-new">
      <button type="button" id="newChatBtn" class="button button-primary">
        <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Nova conversa
      </button>
    </div>

    <nav aria-label="Conversas" class="conversation-list">
      <h2>Conversas</h2>
      <div id="conversationItems"></div>
    </nav>

    <footer class="sidebar-footer">
      <button type="button" id="profileBtn" class="profile-button">
        <span class="avatar avatar-small" id="profileAvatar">?</span>
        <span class="profile-details">
          <strong id="profileName">Meu perfil</strong>
          <span>Configurações</span>
        </span>
        <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 3-.5 2a8 8 0 0 0-1.8 1L4.7 5.5l-2 3.5 1.5 1.4a8 8 0 0 0 0 3.2L2.7 15l2 3.5 2-.5a8 8 0 0 0 1.8 1l.5 2h4l.5-2a8 8 0 0 0 1.8-1l2 .5 2-3.5-1.5-1.4a8 8 0 0 0 0-3.2L19.3 9l-2-3.5-2 .5a8 8 0 0 0-1.8-1L13 3z"/><circle cx="11" cy="12" r="3"/></svg>
      </button>
    </footer>
  </aside>

  <main class="chat-panel">
    <header class="chat-header">
      <button aria-label="Abrir menu de conversas" aria-controls="chat-sidebar" class="icon-button mobile-only" id="openSidebarBtn">
        <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="avatar avatar-small" id="assistantAvatarSmall">?</span>
      <div class="chat-heading">
        <p class="chat-title" id="chatTitle">Nova conversa</p>
        <p class="chat-subtitle" id="chatSubtitle">Carregando assistente...</p>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-content" id="chatContent">

        <div role="alert" class="error-banner" id="errorBanner" hidden>
          <span id="errorText"></span>
          <button type="button" class="text-button" id="retryBtn">Tentar novamente</button>
          <button type="button" class="icon-button" id="dismissErrorBtn" aria-label="Fechar aviso">
            <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M6 18 18 6"/></svg>
          </button>
        </div>

        <div class="welcome" id="welcomeView">
          <p class="welcome-brand">TutorIA</p>
          <h2>Como posso ajudar?</h2>
          <div class="suggestions" id="suggestionsList"></div>
        </div>

        <div aria-live="polite" class="message-list" id="messageList" hidden></div>

      </div>
    </div>

    <div class="composer" id="composerWrap">
      <form id="composerForm" class="composer-form">
        <label for="question" class="sr-only">Sua pergunta</label>
        <textarea id="question" rows="2" placeholder="Pergunte algo sobre a faculdade..." class="composer-input"></textarea>
        <div class="composer-actions">
          <button type="submit" id="sendBtn" class="button button-primary" disabled>Enviar</button>
        </div>
      </form>
    </div>
  </main>

</div>

<dialog id="settingsDialog" aria-labelledby="settings-title" class="settings-dialog">
  <div class="dialog-header">
    <div>
      <h2 id="settings-title" class="dialog-title">Configurações do perfil</h2>
      <p class="muted">Seu nome e sua foto aparecem nas mensagens.</p>
    </div>
    <button type="button" aria-label="Fechar configurações" id="closeSettingsBtn" class="icon-button">
      <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M6 18 18 6"/></svg>
    </button>
  </div>
  <form id="settingsForm" class="settings-form">
    <div class="profile-photo">
      <span class="avatar" id="settingsAvatarPreview">?</span>
      <div class="profile-fields">
        <label for="avatarInput" class="field-label">Foto de perfil</label>
        <input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp" class="file-input">
        <p class="field-hint">PNG, JPEG ou WebP · até 5 MB</p>
      </div>
    </div>
    <div>
      <label for="displayName" class="field-label">Seu nome</label>
      <input id="displayName" maxlength="80" placeholder="Digite seu nome" class="text-input">
    </div>
    <p role="alert" class="field-error" id="settingsError" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="cancelSettingsBtn" class="button button-secondary">Cancelar</button>
      <button type="submit" id="saveSettingsBtn" class="button button-primary">Salvar</button>
    </div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
